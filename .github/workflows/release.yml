name: Release

# Cutting a release is `git tag vX.Y.Z && git push --tags`. This workflow re-runs the declared
# checks against the tagged commit (a tag can point anywhere), builds, publishes to PyPI with
# Trusted Publishing (OIDC — no token secrets), and creates the GitHub release from the matching
# CHANGELOG section. Run it manually to rehearse the whole path against TestPyPI.

on:
  push:
    tags: ["v*"]
  # Manual runs are rehearsals and always target TestPyPI. There is deliberately no way to reach
  # real PyPI from here: that path would skip the tag/version guard below, so one dropdown click
  # on any branch could publish an untagged commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pyproject.toml is the single version source; a tag that disagrees with it is a mistake,
      # not a release.
      - name: Check the tag against the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

      # Built here, before anything is published: a PyPI upload cannot be taken back, so a
      # missing or empty changelog section has to fail while failing is still free.
      - name: Build the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > dist-notes.md

      - run: uv build
      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: dist-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The publishing job is the only one granted an OIDC token, and the environment name must
    # match the trusted publisher configured on the registry.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The PyPA action signs each distribution with the workflow's OIDC identity and uploads
      # PEP 740 attestations by default.
      - name: Publish to TestPyPI (rehearsal)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    # Only a tag push releases. A rehearsal must never create a real GitHub release for
    # artifacts that only reached TestPyPI.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist-notes.md dist/*
