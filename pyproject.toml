[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okdb"
version = "0.0.1"
description = "A transparent, read-only SQL query layer over Open Knowledge Format (OKF) bundles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stanislav Lukyanov", email = "stan@slukyano.dev" }]
keywords = ["okf", "knowledge", "sql", "duckdb", "markdown", "frontmatter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/slukyano/okdb"
Repository = "https://github.com/slukyano/okdb"

[project.scripts]
okdb = "okdb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Never collect the cloned upstream fixtures (they ship their own, unrelated test suite).
addopts = "-ra --ignore=tests/fixtures"
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
